name: Sync official 3x-ui

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge official main into private main
    runs-on: ubuntu-latest

    steps:
      - name: Check out private repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_UPSTREAM_TOKEN || github.token }}

      - name: Fetch and merge official repository
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/MHSanaei/3x-ui.git

          # Official retargets moving tags such as `dev-latest`. Without
          # --force, git 2.55+ fails the fetch with "would clobber existing
          # tag" and the merge never runs. Lightweight tags are not pushed
          # back by --follow-tags, so this only updates the runner's local
          # copies.
          git fetch upstream main --tags --force

          before="$(git rev-parse HEAD)"

          if ! git merge --no-edit upstream/main; then
            echo "::error::Official changes conflict with private main. No code was pushed."
            echo "Conflicting files:"
            git diff --name-only --diff-filter=U || true
            git merge --abort || true
            exit 1
          fi

          after="$(git rev-parse HEAD)"

          if [ "$before" = "$after" ]; then
            echo "Already up to date."
            exit 0
          fi

          if git push origin main --follow-tags; then
            exit 0
          fi

          # GITHUB_TOKEN cannot create or update workflow files. Drop those
          # paths and push the rest so the official code still lands.
          echo "::warning::Push rejected (no workflows permission). Skipping official .github/workflows changes. Set secret SYNC_UPSTREAM_TOKEN to a classic PAT with repo+workflow to sync them too."

          git checkout "$before" -- .github/workflows
          added="$(git diff --diff-filter=A --name-only "$before" HEAD -- .github/workflows || true)"
          if [ -n "$added" ]; then
            # shellcheck disable=SC2086
            git rm -f $added
          fi
          git add -- .github/workflows
          git commit --amend --no-edit
          git push origin main --follow-tags
