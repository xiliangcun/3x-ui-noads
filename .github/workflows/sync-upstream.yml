name: Sync official 3x-ui

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Merge official main into private main
    runs-on: ubuntu-latest

    steps:
      - name: Check out private repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and merge official repository
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/MHSanaei/3x-ui.git
          git fetch upstream main --tags

          before="$(git rev-parse HEAD)"

          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::Official changes conflict with private main. No code was pushed."
            exit 1
          fi

          after="$(git rev-parse HEAD)"

          if [ "$before" = "$after" ]; then
            echo "Already up to date."
            exit 0
          fi

          git push origin main --follow-tags
