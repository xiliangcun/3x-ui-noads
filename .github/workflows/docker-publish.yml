name: No Ads Release to Docker

run-name: 检查 No Ads 同步结果并触发 Docker 发布

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "指定正式 Release 标签，例如 v3.10.2；留空时检查最新正式 Release"
        required: false
        type: string
      force:
        description: "即使镜像已经存在，也强制重新构建"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows:
      - "Sync and publish stable no-ads releases"
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: noads-release-to-docker-${{ github.event.workflow_run.id || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: 验证 Release 和镜像状态
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 解析版本与提交
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_FORCE: ${{ inputs.force }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: |
          set -Eeuo pipefail
          tag="${INPUT_TAG:-}"
          force="false"
          should_dispatch="false"
          reason=""
          release_json=""

          case "${INPUT_FORCE:-false}" in
            true|TRUE|True|1|yes|YES|Yes) force="true" ;;
          esac

          query_release() {
            local endpoint="$1"
            local output_file="${RUNNER_TEMP}/release.json"
            local error_file="${RUNNER_TEMP}/release-error.txt"
            local status
            rm -f "${output_file}" "${error_file}"
            set +e
            gh api -H "Accept: application/vnd.github+json" "${endpoint}" >"${output_file}" 2>"${error_file}"
            status=$?
            set -e
            if [[ ${status} -ne 0 ]]; then
              if grep -q "HTTP 404" "${error_file}"; then
                return 44
              fi
              cat "${error_file}" >&2 || true
              return "${status}"
            fi
            cat "${output_file}"
          }

          if [[ -z "${tag}" ]]; then
            set +e
            release_json="$(query_release "/repos/${REPOSITORY}/releases/latest")"
            query_status=$?
            set -e

            if [[ ${query_status} -eq 44 ]]; then
              reason="当前 Fork 仓库还没有正式 Release，本次正常跳过 Docker 发布"
            elif [[ ${query_status} -ne 0 ]]; then
              echo "::error::查询当前仓库最新 Release 失败，状态码：${query_status}"
              exit "${query_status}"
            else
              tag="$(jq -r '.tag_name // empty' <<<"${release_json}")"
              published_at="$(jq -r '.published_at // empty' <<<"${release_json}")"
              is_draft="$(jq -r '.draft // true' <<<"${release_json}")"
              is_prerelease="$(jq -r '.prerelease // true' <<<"${release_json}")"

              if [[ -z "${tag}" || -z "${published_at}" ]]; then
                reason="当前仓库没有可用的正式 Release，本次正常跳过"
              elif [[ "${is_draft}" == "true" || "${is_prerelease}" == "true" ]]; then
                reason="当前最新 Release 不是正式稳定版本，本次正常跳过"
              elif [[ "${EVENT_NAME}" == "workflow_run" ]]; then
                release_epoch="$(date -u -d "${published_at}" +%s)"
                workflow_epoch="$(date -u -d "${WORKFLOW_STARTED_AT}" +%s)"
                if (( release_epoch < workflow_epoch )); then
                  reason="本次 No Ads 同步没有发布新的正式 Release"
                else
                  should_dispatch="true"
                  reason="检测到本次 No Ads 同步发布了 ${tag}"
                fi
              else
                should_dispatch="true"
                reason="手动选择最新正式 Release：${tag}"
              fi
            fi
          else
            if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([._+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::标签格式不正确：${tag}"
              exit 1
            fi
            set +e
            release_json="$(query_release "/repos/${REPOSITORY}/releases/tags/${tag}")"
            query_status=$?
            set -e
            if [[ ${query_status} -eq 44 ]]; then
              echo "::error::当前 Fork 仓库中不存在正式 Release：${tag}"
              echo "::error::请先让 No Ads 同步工作流成功发布该版本。"
              exit 1
            elif [[ ${query_status} -ne 0 ]]; then
              echo "::error::查询 Release ${tag} 失败，状态码：${query_status}"
              exit "${query_status}"
            fi
            if [[ "$(jq -r '.draft // true' <<<"${release_json}")" == "true" ]]; then
              echo "::error::Release ${tag} 仍然是草稿"
              exit 1
            fi
            if [[ "$(jq -r '.prerelease // true' <<<"${release_json}")" == "true" ]]; then
              echo "::error::Release ${tag} 是预发布版本"
              exit 1
            fi
            should_dispatch="true"
            reason="手动指定正式 Release：${tag}"
          fi

          {
            echo "tag=${tag}"
            echo "force=${force}"
            echo "should_dispatch=${should_dispatch}"
            echo "reason=${reason}"
          } >>"${GITHUB_OUTPUT}"
          {
            echo "## No Ads 到 Docker 发布判定"
            echo
            echo "- 是否触发：\`${should_dispatch}\`"
            echo "- Release：\`${tag:-无}\`"
            echo "- 强制构建：\`${force}\`"
            echo "- 原因：${reason}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: 启动 Docker 发布工作流
        if: steps.resolve.outputs.should_dispatch == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          FORCE: ${{ steps.resolve.outputs.force }}
        run: |
          set -Eeuo pipefail
          gh workflow run docker-publish.yml \
            --repo "${REPOSITORY}" \
            --ref "${GITHUB_REPOSITORY_DEFAULT_BRANCH:-main}" \
            -f version_source=specified \
            -f tag="${RELEASE_TAG}" \
            -f force="${FORCE}"
          echo "已启动 docker-publish.yml，目标版本：${RELEASE_TAG}" >>"${GITHUB_STEP_SUMMARY}"

      - name: 无新 Release，正常结束
        if: steps.resolve.outputs.should_dispatch != 'true'
        shell: bash
        env:
          REASON: ${{ steps.resolve.outputs.reason }}
        run: |
          echo "${REASON}"
          echo "本次不触发 Docker 构建，工作流按成功状态结束。"
